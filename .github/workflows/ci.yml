name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lint tools
        run: pip install black==23.11.0 flake8==6.1.0 bandit
      - name: black (check only)
        run: black --check .
      - name: flake8
        run: flake8 .
      - name: bandit (security lint, non-blocking)
        run: bandit -r src -ll || true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m spacy download de_core_news_sm || true
      - name: Run tests (in-memory SQLite)
        run: pytest -v --cov=src --cov-report=term-missing
