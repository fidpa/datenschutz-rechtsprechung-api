version: '3.8'

services:
  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: dsr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datenschutz_rechtsprechung_api}
      POSTGRES_USER: ${POSTGRES_USER:-dsr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - dsr_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dsr_user} -d ${POSTGRES_DB:-datenschutz_rechtsprechung_api}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # =============================================================================
  # Redis Cache & Sessions
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: dsr_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - dsr_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # FastAPI Backend
  # =============================================================================
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: production
    container_name: dsr_api
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-dsr_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-datenschutz_rechtsprechung_api}"
      REDIS_URL: "redis://default:${REDIS_PASSWORD}@redis:6379"
      API_ENVIRONMENT: production
      API_SECRET_KEY: ${API_SECRET_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ./logs:/app/logs
      - ./data/uploads:/app/uploads
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - dsr_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/system/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =============================================================================
  # Flask Web-UI
  # =============================================================================
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      target: production
    container_name: dsr_web
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-dsr_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-datenschutz_rechtsprechung_api}"
      REDIS_URL: "redis://default:${REDIS_PASSWORD}@redis:6379"
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FLASK_ENV: production
      API_BASE_URL: "http://api:8000"
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
    volumes:
      - ./logs:/app/logs
      - ./data/sessions:/app/sessions
    ports:
      - "127.0.0.1:5001:5001"
    networks:
      - dsr_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/system/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =============================================================================
  # Celery Worker
  # =============================================================================
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: production
    container_name: dsr_worker
    restart: unless-stopped
    command: celery -A src.tasks worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-dsr_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-datenschutz_rechtsprechung_api}"
      REDIS_URL: "redis://default:${REDIS_PASSWORD}@redis:6379"
      CELERY_BROKER_URL: "redis://default:${REDIS_PASSWORD}@redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://default:${REDIS_PASSWORD}@redis:6379/2"
    volumes:
      - ./logs:/app/logs
      - ./data/temp:/app/temp
    networks:
      - dsr_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.tasks inspect ping"]
      interval: 60s
      timeout: 30s
      retries: 3

  # =============================================================================
  # Celery Beat Scheduler
  # =============================================================================
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: production
    container_name: dsr_scheduler
    restart: unless-stopped
    command: celery -A src.tasks beat --loglevel=info --schedule=/app/celerybeat-schedule
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-dsr_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-datenschutz_rechtsprechung_api}"
      REDIS_URL: "redis://default:${REDIS_PASSWORD}@redis:6379"
      CELERY_BROKER_URL: "redis://default:${REDIS_PASSWORD}@redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://default:${REDIS_PASSWORD}@redis:6379/2"
    volumes:
      - ./logs:/app/logs
      - celery_schedule:/app
    networks:
      - dsr_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # =============================================================================
  # nginx Reverse Proxy
  # =============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: dsr_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./config/nginx/sites-enabled:/etc/nginx/sites-enabled
      - ./logs/nginx:/var/log/nginx
      - ./ssl/certbot/conf:/etc/letsencrypt
      - ./ssl/certbot/www:/var/www/certbot
      - ./ssl/dhparam:/etc/nginx/ssl
    networks:
      - dsr_network
    depends_on:
      - api
      - web
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # Certbot für SSL (localhost-Testing mit self-signed)
  # =============================================================================
  certbot:
    image: certbot/certbot:latest
    container_name: dsr_certbot
    volumes:
      - ./ssl/certbot/conf:/etc/letsencrypt
      - ./ssl/certbot/www:/var/www/certbot
    # Für localhost: Disabled, da wir self-signed certificates verwenden
    # command: sh -c "sleep 6h && while true; do certbot renew --webroot --webroot-path=/var/www/certbot; sleep 12h; done"
    command: sh -c "echo 'Certbot disabled for localhost testing'"


volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  celery_schedule:
    driver: local

networks:
  dsr_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16