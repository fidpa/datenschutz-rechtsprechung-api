[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datenschutz-rechtsprechung-api"
version = "0.1.2"
description = "Crawler and search backend for data-protection court decisions in the DACH region"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marc Allgeier" }]
keywords = ["gdpr", "dsgvo", "legal-tech", "fastapi", "postgresql", "anonymisation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

[project.urls]
Repository = "https://github.com/fidpa/datenschutz-rechtsprechung-api"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100
# Pinned to the major version installed by requirements.txt and CI (23.11.0).
# A newer black changes its formatting defaults: 26.3.1 wanted to reformat 50
# files in a tree that 23.11.0 considers clean. Failing loudly beats a silent
# mass-reformat that then turns the CI red.
required-version = "23"
target-version = ["py310", "py311", "py312"]
extend-exclude = '''
/(
    \.venv
  | \.git
  | docs\.legacy
  | archive
  | htmlcov
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100

[tool.bandit]
exclude_dirs = ["tests", ".venv", "archive", "docs.legacy"]
