[pytest]
# pytest Konfiguration für Datenschutz-Rechtsprechung API

# Test-Verzeichnisse
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ausgabe-Optionen
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --asyncio-mode=auto
    -p no:warnings

# Marker für Test-Kategorien
markers =
    unit: Unit Tests (schnell, keine externen Abhängigkeiten)
    integration: Integration Tests (Datenbank, Redis erforderlich)
    slow: Langsame Tests (> 1 Sekunde)
    crawler: Crawler-spezifische Tests
    api: API Endpoint Tests
    db: Datenbank-Tests
    
# Async Test Support
asyncio_mode = auto

# Log-Einstellungen für Tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage-Einstellungen
[coverage:run]
source = src
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod